# ---------------------------------------------------------------------------
# El Migajero — producción con Docker
#
#   cp .env.example .env      # y llena los valores
#   docker compose up -d --build
#
# Nginx del servidor es la única entrada pública:
#   /api/  → backend   (127.0.0.1:${BACKEND_PORT})
#   /      → frontend  (127.0.0.1:${FRONTEND_PORT})
# Ver deploy/nginx/migajero.conf
# ---------------------------------------------------------------------------
name: migajero

x-logging: &logging
  # Evita que los logs llenen el disco del servidor
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: migajero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin "ports": la base solo es accesible desde la red interna de Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *logging
    networks:
      - migajero

  db-backup:
    # Respaldo automático con pg_dump (diario, semanal y mensual) en el volumen db_backups
    image: prodrigestivill/postgres-backup-local:17
    container_name: migajero-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-3}
      HEALTHCHECK_PORT: 8080
    volumes:
      - db_backups:/backups
    mem_limit: 128m
    logging: *logging
    networks:
      - migajero

  redis:
    # Contadores compartidos del límite de peticiones (sin guardar nada en disco)
    image: redis:7-alpine
    container_name: migajero-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    logging: *logging
    networks:
      - migajero

  backend:
    build:
      context: ./backend
    image: migajero-backend
    container_name: migajero-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: "False"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      # "backend" lo usa el frontend al reenviar /api dentro de Docker
      ALLOWED_HOSTS: ${DOMAIN:?Define DOMAIN en .env},www.${DOMAIN},localhost,127.0.0.1,backend
      # Necesario para iniciar sesión en el panel de administración por HTTPS
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "False" # red interna de Docker, no sale a internet
      ADMIN_URL: ${ADMIN_URL:-admin/}
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
      # Nginx → backend: 1 proxy delante (para el límite de peticiones por IP real)
      NUM_PROXIES: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8030}:8000"
    mem_limit: 512m
    logging: *logging
    networks:
      - migajero

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
        NEXT_PUBLIC_API_URL: "" # mismo dominio: el navegador llama a /api
    image: migajero-frontend
    container_name: migajero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3030}:3000"
    mem_limit: 384m
    logging: *logging
    networks:
      - migajero

networks:
  migajero:
    driver: bridge

volumes:
  db_data:
  db_backups:
