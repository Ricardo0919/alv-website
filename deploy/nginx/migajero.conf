# ---------------------------------------------------------------------------
# Nginx para El Migajero  →  /etc/nginx/sites-available/migajero.conf
#
# 1. Cambia "migajero.ejemplo.com" por tu dominio (y los puertos si los cambiaste en .env)
# 2. sudo ln -s /etc/nginx/sites-available/migajero.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS:  sudo certbot --nginx -d migajero.ejemplo.com
# ---------------------------------------------------------------------------

# --- Límites anti abuso / DoS (por IP del cliente) ---
limit_req_zone  $binary_remote_addr zone=migajero_auth:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=migajero_api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=migajero_conn:10m;

upstream migajero_frontend { server 127.0.0.1:3030; keepalive 16; }
upstream migajero_backend  { server 127.0.0.1:8030; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name migajero.ejemplo.com;

    # La API solo recibe JSON pequeño
    client_max_body_size 256k;
    # Corta clientes lentos (ataques "slowloris")
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          15s;
    keepalive_timeout     30s;
    # Máximo de conexiones simultáneas por IP
    limit_conn migajero_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    # No revela la versión de Nginx
    server_tokens off;

    # Login y registro: freno extra contra fuerza bruta
    location /api/auth/ {
        limit_req zone=migajero_auth burst=5 nodelay;
        proxy_pass http://migajero_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Resto de la API → Django
    location /api/ {
        limit_req zone=migajero_api burst=40 nodelay;
        proxy_pass http://migajero_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # El panel de administración NO se publica: entra por túnel SSH
    #   ssh -L 8030:127.0.0.1:8030 usuario@tu-vps   →   http://localhost:8030/<ADMIN_URL>

    # Todo lo demás → Next.js
    location / {
        limit_req zone=migajero_api burst=60 nodelay;
        proxy_pass http://migajero_frontend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
